plugins {
    id "com.android.application"
}

android {
    namespace "com.incidentapp.android"
    compileSdk 36

    defaultConfig {
        applicationId "com.incidentapp.android"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", '"https://incident-app-chi.vercel.app"'
    }

    buildTypes {
        debug {
            def override = providers.gradleProperty("civicpinApiBaseUrl").orElse("https://incident-app-chi.vercel.app").get()
            buildConfigField "String", "API_BASE_URL", groovy.json.JsonOutput.toJson(override)
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.exifinterface:exifinterface:1.4.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}
